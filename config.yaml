# Run `python scripts/validate_watchlist.py` after editing.

watchlist:
  - symbol: NVDA
    asset_type: equity
    note: Nvidia
  - symbol: AMD
    asset_type: equity
    note: Advanced Micro Devices
  - symbol: TSM
    asset_type: foreign
    note: TSMC (US-listed ADR)
  - symbol: AVGO
    asset_type: equity
    note: Broadcom
  - symbol: BTC-USD
    asset_type: crypto
    note: Bitcoin

macro:
  - series_id: DGS10
    label: 10-Year Treasury Yield
    unit: "%"
  - series_id: DGS2
    label: 2-Year Treasury Yield
    unit: "%"
  - series_id: DCOILWTICO
    label: WTI Crude
    unit: "$/bbl"
  - series_id: DFF
    label: Fed Funds Effective Rate
    unit: "%"
  - series_id: VIXCLS
    label: VIX
    unit: ""

thresholds:
  price_move_pct: 2.0
  crypto_move_pct: 4.0
  macro_move_bps: 5
  macro_move_pct: 2.0
  earnings_horizon_days: 14
  filing_lookback_days: 2

filing_forms:
  - "8-K"
  - "4"
  - "SC 13D"
  - "SC 13G"

digest:
  provider: anthropic

  local_model: qwen3.5:9b
  local_url: http://localhost:11434
  local_context: 32768
  local_temperature: 0.2

  model: claude-sonnet-5-5
  max_words: 300
  explain_mechanics: true

forbidden_patterns:
  - '\bbuy\b'
  - '\bsell\b'
  - '\bshort the\b'
  - '\baccumulate\b'
  - '\btrim\b'
  - '\bprice target\b'
  - '\bupside to\b'
  - '\bdownside to\b'
  - '\blikely to (rise|fall|climb|drop|rally|decline)\b'
  - '\bexpect(ed)? to (rise|fall|climb|drop|rally|decline)\b'
  - '\bwill (rise|fall|climb|drop|rally|decline|continue)\b'
  - '\bpoised (to|for)\b'
  - '\bset to (rise|fall|rally|surge|drop)\b'
  - '\bsupport (level|at)\b'
  - '\bresistance (level|at)\b'
  - '\boversold\b'
  - '\boverbought\b'
  - '\bgood (entry|opportunity)\b'
  - '\bshould consider\b'
  - '\brecommend'

desk:
  provider: anthropic            # or "ollama" to keep the desk local too
  model: claude-sonnet-5-5

  web_search: false
  web_search_tool_type: web_search_20250305
  web_search_max_uses: 5

  calendar: []

desk_forbidden_patterns:
  - '\b\d{1,3}\s?% of (your|the) (portfolio|account|capital|savings)\b'
  - '\b(put|invest|allocate) \$\s?\d'
  - '\bgo all[- ]in\b'
  - '\bguaranteed (win|profit|return|gain|money)\b'
  - '\bis guaranteed to\b'
  - "\\bcan'?t lose\\b"
  - '\bsure thing\b'
  - '\brisk[- ]free\b'
  - '\bfree money\b'
  - '\bno[- ]brainer\b'
  - '\bwill definitely\b'
  - '\byou should (buy|sell|short)\b'
  - '\b(buy|sell|short) (it|this|now|today|immediately)\b'

panel:
  provider: ollama
  local_model: qwen3.5:9b
  members:
    - outside
    - inside
    - skeptic
  in_loop: true

health:
  cpu_temp_warn_c: 85
  disk_warn_pct: 85
  ram_warn_pct: 90
  battery_health_warn_pct: 60
  loop_stalled_hours: 6
  services:
    - ollama
    - research-loop
    - market-digest-web
    - tailscaled
    - ssh
  repeat_urgent_hours: 6
  repeat_attention_hours: 24
